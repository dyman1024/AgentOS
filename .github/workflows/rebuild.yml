name: Rebuild verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Select toolchain and install XcodeGen
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          brew install xcodegen
          cd agent-engine && bun install --frozen-lockfile
      - name: Core, WebKit sandbox, native sandbox, engine and app build
        run: make check
      - name: Local media decoding playback and revocation without accounts
        run: python3 scripts/local-host-check.py
      - name: Foreground and background ownership transfer
        run: python3 scripts/background-check.py
      - name: Hardened ad-hoc release and sidecar startup without model calls
        run: make release-test
      - name: Check evaluation and release entry points without paid requests
        run: |
          python3 evals/generation.py
          python3 evals/research.py
          (cd agent-engine && bun run src/evalToolSelection.ts)
          python3 scripts/release.py --help
