<!doctype html>
<!-- Hand-written fixture that follows the AgentOS runtime contract; used by `make selftest`. -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Snake fixture</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CELL = 24;
let cols, rows, snake, dir, nextDir, food, score, scene, acc;

function resize() {
  const dpr = devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cols = Math.floor(innerWidth / CELL);
  rows = Math.floor(innerHeight / CELL);
}

function reset() {
  snake = [{ x: 5, y: 5 }, { x: 4, y: 5 }, { x: 3, y: 5 }];
  dir = nextDir = { x: 1, y: 0 };
  score = 0;
  acc = 0;
  placeFood();
}

function placeFood() {
  food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
}

function step() {
  dir = nextDir;
  const head = { x: (snake[0].x + dir.x + cols) % cols, y: (snake[0].y + dir.y + rows) % rows };
  if (snake.some((s) => s.x === head.x && s.y === head.y)) { scene = 'over'; return; }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) { score += 10; placeFood(); } else { snake.pop(); }
}

const DIRS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    if (scene !== 'play') { reset(); scene = 'play'; }
    return;
  }
  const d = DIRS[e.key];
  if (d && scene === 'play' && (d[0] !== -dir.x || d[1] !== -dir.y)) nextDir = { x: d[0], y: d[1] };
});

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000);
  last = t;
  if (scene === 'play' && !document.hidden) {
    acc += dt;
    while (acc > 0.12 && scene === 'play') { acc -= 0.12; step(); }
  }
  draw(t);
  requestAnimationFrame(frame);
}

function draw(t) {
  ctx.fillStyle = '#10141c';
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.fillStyle = '#ff5d73';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2.6 + Math.sin(t / 200) * 1.5, 0, Math.PI * 2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#7cf29a' : '#3ccf6e';
    ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
  });
  ctx.fillStyle = '#e6e9ef';
  ctx.font = '600 18px -apple-system, system-ui';
  ctx.fillText(`得分 ${score}`, 16, 28);
  if (scene !== 'play') {
    ctx.textAlign = 'center';
    ctx.font = '700 32px -apple-system, system-ui';
    ctx.fillText(scene === 'over' ? '游戏结束' : '贪吃蛇', innerWidth / 2, innerHeight / 2 - 10);
    ctx.font = '16px -apple-system, system-ui';
    ctx.fillText('点击画面后按空格开始，方向键控制', innerWidth / 2, innerHeight / 2 + 24);
    ctx.textAlign = 'start';
  }
}

agentos.expose(() => ({ scene, score, length: snake.length, head: snake[0], dir }));
console.log('snake fixture ready');
addEventListener('resize', resize);
resize();
reset();
scene = 'start';
requestAnimationFrame(frame);
</script>
</body>
</html>
