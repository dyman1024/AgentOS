name: AgentOS
options:
  bundleIdPrefix: dev.agentos
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  AgentOS:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/AgentOS.xcconfig
      Release: Config/AgentOS.xcconfig
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentos.AgentOS
        PRODUCT_NAME: AgentOS
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentOS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
    postBuildScripts:
      - name: Bundle agent engine
        script: '"${SRCROOT}/scripts/bundle-engine.sh"'
        basedOnDependencyAnalysis: false
