name: AgentOS
options:
  bundleIdPrefix: dev.agentos
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  AgentOSKit:
    path: .
targets:
  AgentOS:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/AgentOS.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Host
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: AgentOSKit
        product: AgentOSCore
      - package: AgentOSKit
        product: AgentOSRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentos.AgentOSRebuild
        PRODUCT_NAME: AgentOS
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentOS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "用于按你的请求读取与创建日程，所有操作经过应用授权并记录在活动中。"
        INFOPLIST_KEY_NSContactsUsageDescription: "用于按你的请求查找联系人；联系人资料视为私人数据。"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Config/Virtualization.entitlements
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Bundle agent engine
        script: '"${SRCROOT}/scripts/bundle-engine.sh"'
        basedOnDependencyAnalysis: false
